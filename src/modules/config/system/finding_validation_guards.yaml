# A rule rejects a confirmed validation only when the candidate matches claim_terms
# and every cited evidence artifact matches its contradiction markers.
version: 1
rules:
  - id: local_file_inclusion_open_failure
    claim_terms:
      - local file inclusion
      - lfi
      - file inclusion
    contradiction_all_of:
      - failed to open stream
      - failed opening
  - id: authorization_bypass_denied
    claim_terms:
      - authorization bypass
      - authentication bypass
      - access control bypass
      - idor
      - bola
    contradiction_any_of:
      - "http/1.1 401"
      - "http/1.1 403"
      - "http/2 401"
      - "http/2 403"
  - id: nested_json_claim_flat_response
    claim_terms:
      - nested json
      - nested json structure
      - nested json object
    contradiction_json_shape: flat_json_object
  - id: user_enumeration
    claim_terms:
      - user enumeration
      - username enumeration
    confirmation_requirement: response_comparison
  - id: lack_of_rate_limiting
    claim_terms:
      - lack of rate limiting
      - no rate limiting
      - rate limiting
    confirmation_requirement: rate_limit_probe
  - id: secret_exposure
    claim_terms:
      - secret exposure
      - exposed connection string
      - exposed api key
      - exposed private key
    confirmation_requirement: secret_exposure_revalidation
