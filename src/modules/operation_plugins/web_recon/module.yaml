name: web_recon
version: 1.0.0
description:  Web application security recon
author: Cyber-AutoAgent Team
license: MIT
extend:
  - web
configuration:
  approach: Intelligence-driven web application security assessment leveraging specialized external tools
capabilities:
  - advanced_reconnaissance: Coordinates subfinder, assetfinder, httpx, katana for comprehensive recon
  - authentication_analysis: Deep analysis of JWT, OAuth, SAML, and session-based authentication flows
supported_targets:
  - web-application
  - api-endpoint
  - authentication-service
tools:
  - http_request
  - 'browser_*'
  - '*_search'
  - specialized_recon_orchestrator
  - advanced_payload_coordinator
  - auth_chain_analyzer
module_interface:
  accepts_from: []
  provides_to: []
  finding_categories: ["web-vulnerabilities", "authentication-flaws", "business-logic", "injection-vulnerabilities", "xss-bypasses", "idor-discoveries", "auth-bypasses", "injection-points", "file-traversal", "ssrf"]
planning:
  phase_metadata_contracts:
    - phase_id: 2
      task_creation_mode: snapshot_dependent
    - phase_id: 3
      task_creation_mode: snapshot_dependent
    - phase_id: 4
      task_creation_mode: snapshot_dependent
    - phase_id: 5
      task_creation_mode: snapshot_dependent
  phase_task_contracts:
    - phase_id: 1
      mode: fanout_with_synthesis
      min_mapping_tasks: 3
      mapping_workstreams:
        - service_entrypoints
        - technology_trust_boundary
        - access_context_session
        - workflow_high_value_areas
        - safe_read_only_verification
      synthesis_workstream: inventory_synthesis
      synthesis_output_kind: inventory_manifest
      synthesis_execution: controller
    - phase_id: 2
      mode: fanout
      exclude_public_static_assets: true
      min_mapping_tasks: 3
      mapping_workstreams:
        - unauthenticated_posture
        - authenticated_access_coverage
        - read_only_authorization_comparison
