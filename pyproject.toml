[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-autoagent"
version = "0.10.0"
description = "Cyber-AutoAgent: Autonomous AI agent for ethical security assessments"
readme = "README.md"
authors = [
    {name = "Patrick Double", email = "pat@patdouble.com"},
    {name = "Aaron Brown"}
]
license = {text = "MIT"}
keywords = ["cybersecurity", "penetration-testing", "autonomous", "ai-agent", "security-assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Environment :: Console"
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "strands-agents[ollama,otel,litellm]~=1.54.0",
    "strands-agents-tools~=0.8.3",
    "qdrant-client==1.19.0",
    "google-genai~=1.71.0",
    "litellm>=1.92,<1.98",
    "fastapi>=0.136.3,<0.142.0",
    "azure-identity~=1.25.0",
    "boto3~=1.43.1",
    "botocore~=1.43.1",
    "ollama~=0.6.1",
    "requests~=2.34.2",
    "opentelemetry-api~=1.39.1",
    "opentelemetry-sdk~=1.39.1",
    "opentelemetry-exporter-otlp-proto-http~=1.39.1",
    "pyarrow>=14.0.0,<20.0.0",
    "ragas~=0.3.2",
    "langfuse~=3.14.4",
    "langchain-aws>=1.6.1,<1.8.0",
    "langchain-ollama~=1.1.0",
    "langchain-litellm>=0.6.4,<0.8.0",
    "langchain-google-genai>=4.2.6,<4.4.0",
    "stagehand~=0.5.7",
    "pymitter~=1.1.3",
    "tldextract~=5.3.0",
    "sentence-transformers>=5.6,<5.8",
    "standard-distutils~=3.11.9",
    "guppy3~=3.1.5",
    "validators~=0.35.0",
    "ddgs>=9.14.1,<9.16.0",
    "rapidfuzz~=3.14.3",
    "psutil~=7.2.2",
    "pyyaml~=6.0",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash~=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "black",
    "isort",
    "flake8",
    "mypy"
]

[tool.uv]
# Stagehand 0.5.x is retained for its local-browser behavior but caps LiteLLM at 1.80.
# Override that transitive cap for the explicitly requested LiteLLM 1.92 compatibility assessment.
override-dependencies = ["litellm>=1.92,<1.98"]

[project.urls]
Homepage = "https://github.com/double16/Cyber-AutoAgent-ng"
Repository = "https://github.com/double16/Cyber-AutoAgent-ng"
Documentation = "https://github.com/double16/Cyber-AutoAgent-ng#readme"
"Bug Tracker" = "https://github.com/double16/Cyber-AutoAgent-ng/issues"

[project.scripts]
caa = "cyberautoagent:main"
cyber-autoagent = "cyberautoagent:main"
caa-export-langfuse-session = "modules.langfuse_session_export:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"modules.storage.migrations" = ["*.sql"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "ISC", "RUF"]
# These rules are intentionally unsuitable for this codebase: several inspect dynamically supplied
# values, preserve user-facing Unicode, or create less-readable control flow in test fixtures.
ignore = [
    "B008", "B012", "B017", "B018", "B019", "B023", "B904",
    "E402", "E722",
    "RUF001", "RUF002", "RUF003", "RUF012", "RUF043",
    "SIM102", "SIM105", "SIM108", "SIM115", "SIM117",
    "UP031",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose"
]
pythonpath = ["src"]

[tool.pylint.main]
# Disable specific warnings that are not relevant for this project
disable = [
    "too-many-positional-arguments",  # R0917 - Common for API functions
    "unused-argument",               # W0613 - Common for API compatibility
    "too-many-lines",               # C0302 - Some modules need to be large
    "too-many-nested-blocks",       # R1702 - Complex logic sometimes needed
    "logging-fstring-interpolation", # W1203 - f-strings in logging are readable
    "redefined-outer-name",         # W0621 - Common in function parameters
    "no-else-continue",             # R1724 - Sometimes else-continue is clearer
    "attribute-defined-outside-init" # W0201 - Sometimes needed for complex initialization
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# Allow more arguments and attributes for complex classes
max-args = 10
max-attributes = 15

[dependency-groups]
dev = [
    "pylint~=4.0.6",
    "pyright~=1.1.411",
    "pytest~=9.0.2",
    "pytest-mock~=3.15.1",
    "ruff>=0.15.20,<0.17.0",
    "pytest-asyncio~=1.4.0",
]
